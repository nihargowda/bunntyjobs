# Copy to searches.yaml (same folder) and edit. setup.sh copies it to ~/.applypilot/searches.yaml.
# One entry per job-board search. tier 1 = most important. Keep the list short enough to finish a scan in a few hours.
queries:
  - {query: "product manager", tier: 1}
  - {query: "product owner", tier: 1}
  - {query: "technical product manager", tier: 1}
  - {query: "business analyst", tier: 2}
  - {query: "product operations manager", tier: 3}

# Where to search. Remote and nationwide first, then any cities you prefer.
locations:
  - {location: "Remote", remote: true}
  - {location: "United States", remote: false}
  - {location: "Austin, TX", remote: false}

# Non-remote jobs must match one of these (substring, case-insensitive). Remote jobs always pass.
location_accept: ["United States", "USA", ", US",
  ", AL", ", AK", ", AZ", ", AR", ", CA", ", CO", ", CT", ", DE", ", DC", ", FL", ", GA", ", HI", ", ID",
  ", IL", ", IN", ", IA", ", KS", ", KY", ", LA", ", ME", ", MD", ", MA", ", MI", ", MN", ", MS", ", MO",
  ", MT", ", NE", ", NV", ", NH", ", NJ", ", NM", ", NY", ", NC", ", ND", ", OH", ", OK", ", OR", ", PA",
  ", RI", ", SC", ", SD", ", TN", ", TX", ", UT", ", VT", ", VA", ", WA", ", WV", ", WI", ", WY",
  "California", "Washington", "Oregon", "New York", "Texas", "Maryland", "Virginia"]
location_reject_non_remote: ["Canada", "India", "United Kingdom", "London", "Philippines", "Mexico", ", ON", ", BC"]

country: "USA"

# ZipRecruiter is currently broken in the scraper; LinkedIn often rate-limits but is kept.
sites: [indeed, linkedin, glassdoor]

defaults:
  results_per_site: 50
  hours_old: 72        # the first 48-72h after posting is the best window
  country_indeed: "usa"
